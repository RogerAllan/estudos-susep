<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estudos SUSEP</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mut:#6b6a65;--line:#e3e1da;--acc:#1f5f8b;--accs:#e6eff6;--ok:#2e7d4f;--oks:#e5f3ea;--bad:#b3412f;--bads:#f8e7e3;--warn:#9a6400}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--mut:#a09e97;--line:#34332f;--acc:#7cb8e0;--accs:#1d2a35;--ok:#74c595;--oks:#1b2d22;--bad:#e8897a;--bads:#36201c;--warn:#e0b04f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,Roboto,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.top{max-width:980px;margin:0 auto;padding:12px 16px 6px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:19px;margin:0}
.count{margin-left:auto;font-weight:700;color:var(--acc)}
nav{max-width:980px;margin:0 auto;padding:4px 16px 10px;display:flex;gap:6px;overflow-x:auto}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;font:inherit;font-size:14px}
nav button.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 10px}h3{font-size:16px;margin:16px 0 6px}
.mut{color:var(--mut)}.small{font-size:14px}
.btn{border:1px solid var(--acc);background:var(--acc);color:var(--bg);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px;margin:4px 6px 4px 0}
.btn.g{background:transparent;color:var(--acc)}
.btn.ok{background:var(--ok);border-color:var(--ok)}.btn.bad{background:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.day{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day input{width:20px;height:20px;margin-top:3px;flex:none}
.day.today{background:var(--accs);margin:0 -18px;padding:12px 18px}
.day.done .dt{text-decoration:line-through;color:var(--mut)}
.dl{font-weight:700;min-width:92px;flex:none}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accs);color:var(--acc);margin-right:4px}
ul{margin:6px 0;padding-left:20px}li{margin:3px 0}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--acc)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 13px;border-radius:9px;margin:7px 0;cursor:pointer;font:inherit}
.opt:hover{border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--accs)}
.opt.right{border-color:var(--ok);background:var(--oks)}
.opt.wrong{border-color:var(--bad);background:var(--bads)}
.just{border-left:4px solid var(--acc);background:var(--accs);padding:10px 14px;border-radius:6px;margin-top:10px}
.grid{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.grid button{width:34px;height:30px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer;font-size:13px}
.grid button.a{background:var(--accs);border-color:var(--acc)}.grid button.cur{outline:2px solid var(--acc)}
.fc{min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:19px;padding:24px;border:1px dashed var(--line);border-radius:12px;margin:10px 0}
textarea,input[type=text],select,input[type=number]{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
label{display:block;margin:8px 0 3px;font-size:14px;color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:24px}
.warn{color:var(--warn)}.okc{color:var(--ok)}.badc{color:var(--bad)}
.res h3{color:var(--acc)}
.res table td:first-child{font-weight:600;white-space:nowrap}
.fix{border-left:4px solid var(--warn);padding:8px 12px;background:var(--card);margin:8px 0}
.qt{white-space:pre-line}
.alert{border-color:var(--bad);background:var(--bads)}
</style>
</head>
<body>
<header>
  <div class="top"><h1>SUSEP · Vida e Previdência (FGV)</h1><span class="count" id="count"></span></div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>

<script src="dados.js"></script>
<script>
// ======================= ESTADO =======================
const KEY = 'susep-vp-2026';
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
S = Object.assign({days:{}, q:{}, fc:{}, sims:[], notes:{}, custom:[]}, S || {});
const MIG = {riscos:'prev', oper:'leg', preco:'pessoas'};
S.custom.forEach(q => { if (MIG[q.m]) q.m = MIG[q.m]; });
const mn = m => MAT[m] ? MAT[m].n : 'Fora da prova';
const fk = i => 'f:' + FC[i][0];
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const t = new Date(); return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate()); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const allQ = () => Q.concat(S.custom.filter(q => MAT[q.m]));
const qById = id => allQ().find(x => x.id === id);
const fmtDia = iso => { const [y,m,d] = iso.split('-').map(Number); const dt = new Date(y,m-1,d); return ['dom','seg','ter','qua','qui','sex','sáb'][dt.getDay()]+' '+pad(d)+'/'+pad(m); };

function diasFalta(){ const t = new Date(); t.setHours(0,0,0,0); return Math.round((PROVA - t)/86400000); }
function record(id, ok){ const r = S.q[id] || {n:0, ok:0}; r.n++; if (ok) r.ok++; r.last = ok; S.q[id] = r; }
function statMat(m){ let n=0, ok=0, feitas=0, tot=0; allQ().filter(q=>q.m===m).forEach(q=>{ tot++; const r=S.q[q.id]; if(r){ feitas++; n+=r.n; ok+=r.ok; } }); return {n, ok, feitas, tot, pct: n ? Math.round(ok/n*100) : null}; }

// ======================= NAVEGAÇÃO =======================
const TABS = [['hoje','Hoje'],['plano','Cronograma'],['res','Resumos'],['quest','Questões'],['fc','Flashcards'],['err','Erros'],['desemp','Desempenho']];
let TAB = 'hoje', SUB = null, QZ = null, FCS = null, TIMER = null;
function go(tab, sub){ TAB = tab; SUB = sub === undefined ? null : sub; render(); window.scrollTo(0,0); }
function render(){
  const f = diasFalta();
  document.getElementById('count').textContent = f > 0 ? `faltam ${f} dias · prova 05/12` : f === 0 ? 'HOJE É A PROVA' : 'prova realizada';
  document.getElementById('nav').innerHTML = TABS.map(([k,l]) => `<button class="${k===TAB?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  const M = document.getElementById('main');
  if (TAB !== 'quest' && TIMER) { clearInterval(TIMER); TIMER = null; }
  M.innerHTML = ({hoje:vHoje, plano:vPlano, res:vRes, quest:vQuest, fc:vFc, err:vErr, desemp:vDesemp})[TAB]();
  if (TAB === 'quest' && QZ && QZ.mode === 'sim') startTimer();
}

function acaoBtn(a){
  const [k, v] = a;
  if (k === 'q') return `<button class="btn" onclick="treinoMat('${v}')">Treinar ${mn(v)}</button>`;
  if (k === 'fc') return `<button class="btn g" onclick="startFc('${v}')">Flashcards${v ? ' · '+mn(v) : ' · todos'}</button>`;
  if (k === 'mix') return `<button class="btn" onclick="misto(${v})">Misto de ${v} questões</button>`;
  if (k === 'sim') return `<button class="btn" onclick="simulado()">Simulado completo (2 h)</button>`;
  if (k === 'err') return `<button class="btn g" onclick="go('err')">Caderno de erros</button>`;
  if (k === 'res') return `<button class="btn g" onclick="go('res','${v}')">Resumo: ${RESN[v]}</button>`;
  return '';
}

// ======================= VIEWS =======================
function vHoje(){
  const hoje = todayISO();
  let p = PLANO.find(x => x.d === hoje);
  let aviso = '';
  if (!p) { p = PLANO.find(x => x.d > hoje && !S.days[x.d]) || PLANO[PLANO.length-1]; aviso = `<p class="mut small">Sem item marcado para hoje; mostrando o próximo pendente (${fmtDia(p.d)}).</p>`; }
  const atrasados = PLANO.filter(x => x.d < hoje && !S.days[x.d]);
  const feitos = PLANO.filter(x => S.days[x.d]).length;
  let proj = 0, base = 0;
  Object.keys(MAT).forEach(m => { const s = statMat(m); if (s.pct !== null) { proj += s.pct/100*MAT[m].p; base += MAT[m].p; } });
  const projPct = base ? Math.round(proj/base*100) : null;
  const al = [];
  if (hoje <= EDITAL.pagamento) al.push('<b>25/11 é o último dia para pagar a taxa de inscrição.</b> Se ainda não pagou, pague antes de estudar.');
  if (!S.teste && hoje <= EDITAL.testeFim) al.push(`Faça o <b>teste do sistema do exame on-line remoto</b> (de 26/11 a 04/12), no computador e na internet que vai usar no dia.<label style="display:flex;gap:8px;align-items:center;margin-top:6px;color:var(--ink)"><input type="checkbox" onchange="S.teste=this.checked;save();render()"> Já fiz o teste do sistema</label>`);
  return `
  ${al.length ? `<div class="card alert"><h2 class="badc">Prazos do edital</h2><ul>${al.map(x=>`<li>${x}</li>`).join('')}</ul></div>` : ''}
  <div class="kpi" style="margin-bottom:14px">
    <div><span class="mut small">Dias até a prova</span><b>${Math.max(diasFalta(),0)}</b></div>
    <div><span class="mut small">Dias do plano concluídos</span><b>${feitos}/${PLANO.length}</b></div>
    <div><span class="mut small">Acerto médio (pesos da prova)</span><b class="${projPct===null?'':projPct>=70?'okc':'badc'}">${projPct===null?'—':projPct+'%'}</b></div>
    <div><span class="mut small">Questões para revisar</span><b>${errIds().length}</b></div>
  </div>
  <div class="card">
    <h2>${fmtDia(p.d)} · ${p.t}</h2>${aviso}
    <ul>${p.i.map(x=>`<li>${x}</li>`).join('')}</ul>
    <div>${p.a.map(acaoBtn).join('')}</div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--ink)"><input type="checkbox" ${S.days[p.d]?'checked':''} onchange="marcaDia('${p.d}',this.checked)"> Concluí este dia</label>
  </div>
  ${atrasados.length ? `<div class="card"><h2 class="warn">Atrasados (${atrasados.length})</h2><ul>${atrasados.map(x=>`<li>${fmtDia(x.d)} · ${x.t}</li>`).join('')}</ul><p class="small mut">Não tente recuperar tudo: junte com o dia seguinte e priorize Previdência e Pessoas (20 questões cada).</p></div>` : ''}
  <div class="card"><h2>Como estudar cada dia (≈ 2 h 30)</h2>
  <ol><li><b>40 min</b>: resumo da matéria do dia (aba Resumos) + apostila nos pontos que não ficarem claros.</li><li><b>50 min</b>: questões. Antes de clicar, diga para você mesmo <i>por quê</i>.</li><li><b>20 min</b>: cada erro vai para a aba Erros com a sua justificativa escrita.</li><li><b>20 min</b>: flashcards.</li></ol>
  <p class="small mut">Prova FGV (05/12, 16h30 às 18h30): Legislação 10 · Previdência Privada 20 · Seguro de Pessoas 20. Passa com 35 acertos (70%) e nenhuma disciplina zerada.</p></div>`;
}
function marcaDia(d, v){ S.days[d] = v; save(); render(); }

function vPlano(){
  const hoje = todayISO();
  return `<div class="card"><h2>Cronograma até 05/12</h2>${PLANO.map(p => `
    <div class="day ${p.d===hoje?'today':''} ${S.days[p.d]?'done':''}">
      <input type="checkbox" ${S.days[p.d]?'checked':''} onchange="marcaDia('${p.d}',this.checked)">
      <div><div class="dt"><span class="dl">${fmtDia(p.d)}</span> <b>${p.t}</b></div>
      <ul class="small">${p.i.map(x=>`<li>${x}</li>`).join('')}</ul>${p.a.map(acaoBtn).join('')}</div>
    </div>`).join('')}</div>`;
}

function vRes(){
  const keys = ['edital','leg','prev','pessoas','sumulas','numeros'];
  const cur = SUB && RES[SUB] ? SUB : 'edital';
  return `<div class="card"><div class="row">${keys.map(k=>`<button class="btn ${k===cur?'':'g'}" onclick="go('res','${k}')">${RESN[k]}</button>`).join('')}</div></div>
  <div class="card res"><h2>${RESN[cur]}${MAT[cur]?` <span class="tag">${MAT[cur].p} questões</span>`:''}</h2>${RES[cur]}
  ${MAT[cur]?`<div style="margin-top:14px">${acaoBtn(['q',cur])}${acaoBtn(['fc',cur])}</div>`:''}</div>`;
}

// ---------- Questões
function treinoMat(m){ startQuiz(shuffle(allQ().filter(q=>q.m===m).map(q=>q.id)), 'treino', 'Treino · '+mn(m)); }
function misto(n){ startQuiz(shuffle(allQ().map(q=>q.id)).slice(0,n), 'treino', `Misto de ${n}`); }
function simulado(){
  let ids = [];
  Object.keys(MAT).forEach(m => { ids = ids.concat(shuffle(allQ().filter(q=>q.m===m).map(q=>q.id)).slice(0, MAT[m].p)); });
  startQuiz(shuffle(ids), 'sim', 'Simulado completo');
}
function treinoErros(){ const ids = errIds(); if (!ids.length) { alertBox('Nenhuma questão errada para revisar.'); return; } startQuiz(shuffle(ids), 'treino', 'Só as erradas'); }
function startQuiz(ids, mode, title){
  QZ = {ids, i:0, mode, title, ans:{}, shown:{}, perm:{}, start:Date.now(), dur: mode==='sim' ? Math.round(ids.length*144) : 0, fim:false};
  ids.forEach(id => QZ.perm[id] = shuffle(qById(id).o.map((_,k)=>k)));
  go('quest');
}
let ALERT = '';
function alertBox(t){ ALERT = t; go('quest'); }

function vQuest(){
  if (!QZ) {
    const msg = ALERT ? `<div class="card warn">${esc(ALERT)}</div>` : ''; ALERT = '';
    return `${msg}<div class="card"><h2>Escolha um treino</h2>
      <h3>Por matéria (resposta comentada na hora)</h3><div>${Object.keys(MAT).map(m=>`<button class="btn g" onclick="treinoMat('${m}')">${mn(m)} (${allQ().filter(q=>q.m===m).length})</button>`).join('')}</div>
      <h3>Misto</h3><button class="btn" onclick="misto(10)">10 questões</button><button class="btn" onclick="misto(20)">20 questões</button><button class="btn" onclick="misto(30)">30 questões</button>
      <h3>Prova</h3><button class="btn" onclick="simulado()">Simulado completo cronometrado</button><span class="small mut"> pesos da prova, ${Math.round(simSize()*144/60)} min, correção só no fim</span>
      <h3>Revisão</h3><button class="btn bad" onclick="treinoErros()">Só as que errei (${errIds().length})</button>
      <p class="small mut">Banco: ${allQ().length} questões (${S.custom.length} suas). Questões que você copiar da apostila e dos simulados entram nos treinos e no simulado.</p></div>
      ${vAddQ()}`;
  }
  if (QZ.fim) return vResultado();
  const id = QZ.ids[QZ.i], q = qById(id), perm = QZ.perm[id], sel = QZ.ans[id];
  const shown = QZ.mode === 'treino' && QZ.shown[id];
  const L = 'ABCDE';
  const opts = perm.map((k, pos) => {
    let cls = 'opt';
    if (shown) { if (k === q.c) cls += ' right'; else if (k === sel) cls += ' wrong'; }
    else if (k === sel) cls += ' sel';
    return `<button class="${cls}" ${shown?'disabled':''} onclick="responde(${k})"><b>${L[pos]})</b> ${esc(q.o[k])}</button>`;
  }).join('');
  const grid = QZ.mode === 'sim' ? `<div class="grid">${QZ.ids.map((x,n)=>`<button class="${QZ.ans[x]!==undefined?'a':''} ${n===QZ.i?'cur':''}" onclick="QZ.i=${n};render()">${n+1}</button>`).join('')}</div>` : '';
  const just = shown ? `<div class="just"><b>${sel===q.c?'<span class="okc">Certo!</span>':'<span class="badc">Errado.</span>'}</b> Resposta: <b>${esc(q.o[q.c])}</b><br>${esc(q.j||'')}</div>` : '';
  const ultima = QZ.i === QZ.ids.length - 1;
  return `<div class="card">
    <div class="row"><b>${esc(QZ.title)}</b><span class="tag">${mn(q.m)}</span><span class="mut small">questão ${QZ.i+1} de ${QZ.ids.length}</span>${QZ.mode==='sim'?'<span id="timer" style="margin-left:auto;font-weight:700"></span>':''}</div>
    ${grid}
    <p class="qt" style="font-size:17px;margin:14px 0 6px">${esc(q.q)}</p>${opts}${just}
    <div style="margin-top:12px">
      ${QZ.i>0?'<button class="btn g" onclick="QZ.i--;render()">← Anterior</button>':''}
      ${QZ.mode==='treino' && !shown ? '<span class="small mut">Pense no porquê antes de clicar.</span>' : ''}
      ${(QZ.mode==='sim' || shown) && !ultima ? '<button class="btn" onclick="QZ.i++;render()">Próxima →</button>' : ''}
      ${ultima && (QZ.mode==='sim' || shown) ? `<button class="btn ok" onclick="finaliza()">${QZ.mode==='sim'?'Entregar simulado':'Ver resultado'}</button>` : ''}
      <button class="btn g" onclick="sair()">Sair</button>
    </div></div>`;
}
function simSize(){ return Object.keys(MAT).reduce((s,m)=>s+Math.min(MAT[m].p, allQ().filter(q=>q.m===m).length),0); }
function responde(k){
  const id = QZ.ids[QZ.i];
  if (QZ.mode === 'treino') { if (QZ.shown[id]) return; QZ.ans[id] = k; QZ.shown[id] = true; record(id, k === qById(id).c); save(); }
  else QZ.ans[id] = k;
  render();
}
function finaliza(){
  if (QZ.mode === 'sim') {
    QZ.ids.forEach(id => record(id, QZ.ans[id] === qById(id).c));
    const by = {}; QZ.ids.forEach(id => { const m = qById(id).m; by[m] = by[m] || [0,0]; by[m][1]++; if (QZ.ans[id] === qById(id).c) by[m][0]++; });
    const ok = QZ.ids.filter(id => QZ.ans[id] === qById(id).c).length;
    S.sims.push({d: todayISO(), t: QZ.title, ok, tot: QZ.ids.length, min: Math.round((Date.now()-QZ.start)/60000), by});
    save();
  }
  QZ.fim = true; if (TIMER) { clearInterval(TIMER); TIMER = null; } render();
}
function sair(){ if (TIMER) { clearInterval(TIMER); TIMER = null; } QZ = null; render(); }
function startTimer(){
  if (TIMER) clearInterval(TIMER);
  const tick = () => {
    const el = document.getElementById('timer'); if (!QZ || QZ.fim) { clearInterval(TIMER); TIMER = null; return; }
    const rest = QZ.dur - Math.floor((Date.now()-QZ.start)/1000);
    if (rest <= 0) { finaliza(); return; }
    if (el) { el.textContent = `⏱ ${Math.floor(rest/3600)}:${pad(Math.floor(rest%3600/60))}:${pad(rest%60)}`; el.className = rest < 600 ? 'badc' : ''; }
  };
  tick(); TIMER = setInterval(tick, 1000);
}
function vResultado(){
  const ok = QZ.ids.filter(id => QZ.ans[id] === qById(id).c).length, tot = QZ.ids.length, pct = Math.round(ok/tot*100);
  const erradas = QZ.ids.filter(id => QZ.ans[id] !== qById(id).c);
  return `<div class="card"><h2>${esc(QZ.title)}: ${ok}/${tot} (${pct}%)</h2>
    ${QZ.mode==='sim' ? vRegra() : `<p class="${pct>=70?'okc':'badc'}">${pct>=70?'Dentro da meta de treino (70%).':'Abaixo da meta de treino (70%). Foque nas erradas abaixo.'}</p>`}
    ${erradas.map(id => { const q = qById(id); return `<div class="just" style="border-color:var(--bad);background:var(--bads)"><span class="tag">${mn(q.m)}</span><br><b class="qt">${esc(q.q)}</b><br>Você marcou: ${QZ.ans[id]!==undefined?esc(q.o[QZ.ans[id]]):'<i>em branco</i>'}<br>Certa: <b>${esc(q.o[q.c])}</b><br><span class="small">${esc(q.j||'')}</span></div>`; }).join('')}
    <div style="margin-top:12px"><button class="btn" onclick="go('err')">Escrever justificativas dos erros</button><button class="btn g" onclick="sair()">Voltar</button></div></div>`;
}

function vRegra(){
  const by = {}; QZ.ids.forEach(id => { const m = qById(id).m; by[m] = by[m] || [0,0]; by[m][1]++; if (QZ.ans[id] === qById(id).c) by[m][0]++; });
  const ok = QZ.ids.filter(id => QZ.ans[id] === qById(id).c).length, pct = Math.round(ok/QZ.ids.length*100);
  const zerou = Object.keys(by).filter(m => by[m][0] === 0);
  const passou = pct >= 70 && !zerou.length;
  return `<table>${Object.keys(by).map(m=>`<tr><td>${mn(m)}</td><td class="${by[m][0]===0?'badc':''}">${by[m][0]}/${by[m][1]}</td></tr>`).join('')}</table>
    <p class="${passou?'okc':'badc'}" style="margin-top:10px"><b>${passou?'Aprovado pela regra do edital':'Ainda não passaria pela regra do edital'}</b>: precisa de 70% no total${zerou.length?` e zerou ${zerou.map(mn).join(', ')}`:' e nenhuma disciplina zerada'}.</p>`;
}

function vAddQ(){
  return `<div class="card"><h2>Adicionar questão sua (da apostila ou simulado)</h2>
    <label>Matéria</label><select id="nq-m">${Object.keys(MAT).map(m=>`<option value="${m}">${mn(m)}</option>`).join('')}</select>
    <label>Enunciado</label><textarea id="nq-q" rows="3"></textarea>
    <label>Alternativas (uma por linha)</label><textarea id="nq-o" rows="5"></textarea>
    <label>Número da alternativa correta (1 = primeira linha)</label><input id="nq-c" type="number" min="1" value="1">
    <label>Justificativa (por que a certa é a certa)</label><textarea id="nq-j" rows="2"></textarea>
    <button class="btn" onclick="addQ()">Salvar questão</button> <span id="nq-msg" class="small"></span>
    ${S.custom.length ? `<h3>Suas questões</h3><table>${S.custom.map(q=>`<tr><td>${mn(q.m)}</td><td>${esc(q.q)}</td><td><button class="btn g" onclick="delQ('${q.id}')">apagar</button></td></tr>`).join('')}</table>` : ''}</div>`;
}
function addQ(){
  const g = id => document.getElementById(id).value.trim();
  const o = g('nq-o').split('\n').map(s=>s.trim()).filter(Boolean), c = parseInt(g('nq-c'),10) - 1;
  const msg = document.getElementById('nq-msg');
  if (!g('nq-q') || o.length < 2 || isNaN(c) || c < 0 || c >= o.length) { msg.textContent = 'Preencha o enunciado, pelo menos 2 alternativas e um número válido.'; msg.className = 'small badc'; return; }
  S.custom.push({id:'u'+Date.now(), m:g('nq-m'), q:g('nq-q'), o, c, j:g('nq-j')}); save(); render();
}
function delQ(id){ S.custom = S.custom.filter(q => q.id !== id); delete S.q[id]; save(); render(); }

// ---------- Flashcards
function startFc(m){
  const idx = FC.map((_,i)=>i).filter(i => !m || FC[i][2] === m);
  const box = i => S.fc[fk(i)] || 1;
  const ord = shuffle(idx).sort((a,b) => box(a) - box(b));
  FCS = {m, ord, i:0, vira:false}; go('fc');
}
function vFc(){
  const cont = [1,2,3].map(b => FC.filter((_,i)=>(S.fc[fk(i)]||1)===b).length);
  const head = `<div class="card"><h2>Flashcards</h2><p class="small mut">Caixa 1 = não sei · caixa 2 = quase · caixa 3 = sei. Errou volta para a 1. As da caixa 1 aparecem primeiro.<br>Agora: caixa 1: <b>${cont[0]}</b> · caixa 2: <b>${cont[1]}</b> · caixa 3: <b>${cont[2]}</b></p>
    <button class="btn" onclick="startFc('')">Todos</button>${Object.keys(MAT).map(m=>`<button class="btn g" onclick="startFc('${m}')">${mn(m)}</button>`).join('')}</div>`;
  if (!FCS) return head;
  if (FCS.i >= FCS.ord.length) return head + `<div class="card"><h2>Rodada terminada</h2><button class="btn" onclick="startFc(FCS.m)">De novo</button></div>`;
  const k = FCS.ord[FCS.i], c = FC[k];
  return head + `<div class="card"><div class="row"><span class="tag">${mn(c[2])}</span><span class="small mut">${FCS.i+1}/${FCS.ord.length} · caixa ${S.fc[fk(k)]||1}</span></div>
    <div class="fc" onclick="FCS.vira=true;render()">${FCS.vira ? `<div><div class="mut small">${esc(c[0])}</div><div style="margin-top:8px"><b>${esc(c[1])}</b></div></div>` : `<b>${esc(c[0])}</b>`}</div>
    ${FCS.vira ? `<button class="btn bad" onclick="fcResp(false)">Errei</button><button class="btn ok" onclick="fcResp(true)">Acertei</button>` : `<button class="btn" onclick="FCS.vira=true;render()">Mostrar resposta</button>`}</div>`;
}
function fcResp(ok){ const k = FCS.ord[FCS.i]; S.fc[fk(k)] = ok ? Math.min(3,(S.fc[fk(k)]||1)+1) : 1; save(); FCS.i++; FCS.vira = false; render(); }

// ---------- Erros
function errIds(){ return allQ().filter(q => S.q[q.id] && S.q[q.id].last === false).map(q => q.id); }
function vErr(){
  const ids = errIds();
  const outras = allQ().filter(q => S.q[q.id] && S.q[q.id].last && S.q[q.id].ok < S.q[q.id].n).length;
  return `<div class="card"><h2>Caderno de erros (${ids.length})</h2>
    <p class="small mut">Aqui ficam as questões cuja última resposta foi errada. Escreva com suas palavras por que a certa é a certa. Quando acertar de novo, ela sai da lista. ${outras?`(${outras} já foram recuperadas.)`:''}</p>
    ${ids.length?'<button class="btn bad" onclick="treinoErros()">Refazer só as erradas</button>':''}</div>
    ${ids.map(id => { const q = qById(id); return `<div class="card"><span class="tag">${mn(q.m)}</span> <span class="small mut">errou ${S.q[id].n-S.q[id].ok} de ${S.q[id].n}</span>
      <p class="qt"><b>${esc(q.q)}</b></p><p>Certa: <b class="okc">${esc(q.o[q.c])}</b></p><p class="small">${esc(q.j||'')}</p>
      <label>Minha justificativa</label><textarea rows="2" oninput="S.notes['${id}']=this.value;save()">${esc(S.notes[id]||'')}</textarea></div>`; }).join('')}`;
}

// ---------- Desempenho
function vDesemp(){
  const linhas = Object.keys(MAT).map(m => { const s = statMat(m); return `<tr><td>${mn(m)}</td><td>${MAT[m].p}</td><td>${s.feitas}/${s.tot}</td>
    <td>${s.pct===null?'<span class="mut">—</span>':`<span class="${s.pct>=70?'okc':'badc'}">${s.pct}%</span>`}</td><td><div class="bar"><i style="width:${s.pct||0}%"></i></div></td></tr>`; }).join('');
  const piores = Object.keys(MAT).map(m=>[m,statMat(m).pct]).filter(x=>x[1]!==null).sort((a,b)=>a[1]-b[1]||MAT[b[0]].p-MAT[a[0]].p);
  return `<div class="card"><h2>Por matéria</h2><table><tr><th>Matéria</th><th>Questões na prova</th><th>Vistas</th><th>Acerto</th><th></th></tr>${linhas}</table>
    ${piores.length?`<p>Prioridade agora: <b>${MAT[piores[0][0]].n}</b>${piores[1]?` e depois <b>${MAT[piores[1][0]].n}</b>`:''}.</p>`:'<p class="mut">Faça alguns treinos para aparecer aqui.</p>'}</div>
    <div class="card"><h2>Simulados</h2>${S.sims.length?`<table><tr><th>Dia</th><th>Nota</th><th>Tempo</th><th>Por matéria</th></tr>${S.sims.map(s=>`<tr><td>${fmtDia(s.d)}</td><td><b>${s.ok}/${s.tot}</b> (${Math.round(s.ok/s.tot*100)}%)</td><td>${s.min} min</td><td class="small">${Object.keys(s.by).map(m=>`${MAT[m]?mn(m):m}: ${s.by[m][0]}/${s.by[m][1]}`).join(' · ')}</td></tr>`).join('')}</table>`:'<p class="mut">Nenhum simulado completo ainda.</p>'}</div>
    <div class="card"><h2>Backup do progresso</h2><p class="small mut">O progresso fica salvo neste navegador. Para não perder (ou levar para outro navegador), exporte de vez em quando.</p>
    <button class="btn g" onclick="exporta()">Exportar progresso</button><label class="btn g" style="display:inline-block">Importar<input type="file" accept=".json" style="display:none" onchange="importa(this)"></label>
    <button class="btn bad" onclick="zerar(this)">Zerar tudo</button></div>`;
}
function exporta(){ const b = new Blob([JSON.stringify(S,null,1)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'progresso-susep-'+todayISO()+'.json'; a.click(); }
function importa(inp){ const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { S = Object.assign({days:{},q:{},fc:{},sims:[],notes:{},custom:[]}, JSON.parse(r.result)); save(); render(); } catch(e) { inp.parentNode.textContent = 'Arquivo inválido'; } }; r.readAsText(f); }
function zerar(b){ if (b.dataset.c) { S = {days:{},q:{},fc:{},sims:[],notes:{},custom:[]}; save(); render(); } else { b.dataset.c = 1; b.textContent = 'Clique de novo para confirmar'; } }

render();
</script>
</body>
</html>
